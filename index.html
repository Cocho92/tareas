<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9dcdf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24282d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tareas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Mis tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* =========================================================
   1. DESIGN TOKENS
   Concepto: tarjetero T-card — rack de acero con ranuras
   y tarjetas de cartulina en forma de T.
   Para cambiar el look, empezá SIEMPRE por acá.
   ========================================================= */
:root {
  /* Tipografía: una familia, distintos anchos (eje wdth) */
  --font: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --wdth-condensed: 72%;   /* títulos y etiquetas del rack */
  --wdth-card: 88%;        /* títulos de tarjeta */
  --wdth-text: 100%;       /* texto corrido */

  /* Escala tipográfica (≈1.2) */
  --fs-xs: 0.75rem;   /* 12 */
  --fs-sm: 0.875rem;  /* 14 */
  --fs-md: 1rem;      /* 16 */
  --fs-lg: 1.25rem;   /* 20 */
  --fs-xl: 1.625rem;  /* 26 */

  /* Espaciado */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  /* Radios con jerarquía: papel casi recto, chapa algo más redondeada */
  --radius-card: 2px;
  --radius-control: 4px;
  --radius-rack: 6px;

  /* Layout */
  --column-width: 86vw;   /* mobile; en desktop pasa a 300px (sección 8) */
  --card-inset: 14px;     /* cuánto más angosto es el cuerpo de la T */
  --tap: 44px;            /* área táctil mínima (Apple HIG) */
  --kb: 0px;              /* alto del teclado en pantalla; lo actualiza app.js */
  --vvh: 100dvh;          /* alto visible real; lo actualiza app.js */
  --transition: 140ms ease;

  /* Esmaltes de las placas de cada columna (los usa COLUMNS en app.js) */
  --c-slate: #7a8591;
  --c-sky: #3d6ea8;
  --c-amber: #b9831c;
  --c-emerald: #4f8a5b;
  --c-rose: #b4533c;
  --c-violet: #6f5a9e;

  /* Cartulinas por prioridad */
  --stock-alta: #f0b49c;
  --stock-media: #efd9a0;
  --stock-baja: #c9dcbc;
  --card-ink: #22262b;          /* tinta sobre cartulina: igual en ambos temas */
  --card-ink-muted: #4d535a;
  --card-edge: rgb(34 38 43 / 0.18);
}

/* ---------- Tema claro (default): acero pintado ---------- */
:root {
  --bg: #d9dcdf;
  --rack: #cdd1d5;
  --slot: rgb(34 38 43 / 0.09);
  --plate: #eceef0;
  --surface: #f4f5f6;
  --border: #b9bec4;
  --text: #22262b;
  --text-muted: #5c636b;
  --primary: #1f4e8c;
  --primary-hover: #183f73;
  --primary-text: #ffffff;
  --danger: #a83a24;
  --focus: #1f4e8c;
  --card-shadow: 0 1px 0 rgb(34 38 43 / 0.25);
  --overdue: #8c2c18;
  --flash: #1f4e8c;
}

/* ---------- Tema oscuro: grafito; las tarjetas siguen siendo papel ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #24282d;
    --rack: #2c3137;
    --slot: rgb(255 255 255 / 0.05);
    --plate: #383e45;
    --surface: #31363c;
    --border: #4a5159;
    --text: #e3e5e8;
    --text-muted: #a0a7af;
    --primary: #5b8fd1;
    --primary-hover: #74a2dc;
    --primary-text: #10233d;
    --danger: #f08a73;
    --focus: #8db3e2;
    --stock-alta: #dc9f88;
    --stock-media: #dbc58c;
    --stock-baja: #b2c7a5;
    --card-shadow: 0 1px 0 rgb(0 0 0 / 0.5);
    --overdue: #8a2a17;
  --flash: #8db3e2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #24282d;
  --rack: #2c3137;
  --slot: rgb(255 255 255 / 0.05);
  --plate: #383e45;
  --surface: #31363c;
  --border: #4a5159;
  --text: #e3e5e8;
  --text-muted: #a0a7af;
  --primary: #5b8fd1;
  --primary-hover: #74a2dc;
  --primary-text: #10233d;
  --danger: #f08a73;
  --focus: #8db3e2;
  --stock-alta: #dc9f88;
  --stock-media: #dbc58c;
  --stock-baja: #b2c7a5;
  --card-shadow: 0 1px 0 rgb(0 0 0 / 0.5);
  --overdue: #8a2a17;
  --flash: #8db3e2;
  color-scheme: dark;
}

/* =========================================================
   2. BASE
   ========================================================= */
*,
*::before,
*::after { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-stretch: var(--wdth-text);
  font-size: var(--fs-md);
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p { margin: 0; }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* =========================================================
   3. COMPONENTES GENÉRICOS (botones, inputs)
   ========================================================= */
.btn {
  display: inline-flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: var(--tap);
  padding: 0 var(--space-4);
  border: 1px solid transparent;
  border-radius: var(--radius-control);
  font: inherit;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text);
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--transition), border-color var(--transition);
}

.btn--primary { background: var(--primary); color: var(--primary-text); }
.btn--primary:hover { background: var(--primary-hover); }

.btn--ghost { border-color: var(--border); background: var(--surface); }
.btn--ghost:hover { border-color: var(--text-muted); }

.btn--danger { color: var(--danger); padding-left: 0; }
.btn--danger:hover { text-decoration: underline; }

.btn--icon { width: var(--tap); padding: 0; font-size: var(--fs-lg); line-height: 1; }
.btn svg { flex-shrink: 0; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.input {
  width: 100%;
  min-height: 40px;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-control);
  font: inherit;
  font-size: var(--fs-md); /* 16px en mobile: evita el zoom de iOS */
  color: var(--text);
  background: var(--surface);
  box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.08);
  transition: border-color var(--transition);
}
.input::placeholder { color: var(--text-muted); }
.input:focus { outline: none; border-color: var(--focus); }
textarea.input { resize: vertical; line-height: 1.5; }

/* Descripción del formulario: crece con el texto para leerla entera de un
   vistazo; el formulario completo es el que scrollea */
#f-desc {
  min-height: calc(5 * 1.5em + 2 * var(--space-2));
  resize: none;
  overflow: hidden;
  field-sizing: content;
}
select.input option { background: var(--surface); color: var(--text); }

.spacer { flex: 1; }

/* =========================================================
   4. TOPBAR, BÚSQUEDA, MENÚ Y BARRA DE PEDIDOS
   Mobile first (iPhone SE: 375 × 667): una sola fila arriba,
   la barra de pedidos fija abajo, al alcance del pulgar.
   ========================================================= */
/* Sticky + fondo sólido: iOS 26 no dibuja su desenfoque de borde
   ("scroll edge effect") cuando una barra fija/sticky opaca cubre el borde */
.topbar {
  position: fixed;
  top: var(--vv-top, 0px);
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  padding-block: var(--space-2);
  padding-top: max(var(--space-2), env(safe-area-inset-top, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}

.topbar__brand { display: flex; align-items: center; gap: var(--space-2); flex: 1; min-width: 0; }

/* Logo: una T-card dibujada con fondos */
.topbar__logo {
  flex-shrink: 0;
  width: 20px;
  height: 25px;
  background:
    linear-gradient(var(--stock-media), var(--stock-media)) top / 100% 8px no-repeat,
    linear-gradient(var(--stock-media), var(--stock-media)) center / 64% 100% no-repeat;
  filter: drop-shadow(0 0 0.5px var(--card-ink)) drop-shadow(0 1px 0 var(--card-edge));
}

.topbar__title {
  font-size: var(--fs-lg);
  font-weight: 760;
  font-stretch: var(--wdth-condensed);
  letter-spacing: -0.01em;
  line-height: 1;
  white-space: nowrap;
}

/* Estado de sincronización junto al título */
.topbar__status {
  overflow: hidden;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  text-overflow: ellipsis;
}
.topbar__status:empty { display: none; }

.topbar__actions { display: flex; align-items: center; gap: var(--space-2); }
.topbar__new-label { display: none; }
#btn-search[aria-expanded="true"] { border-color: var(--focus); color: var(--focus); }

/* Búsqueda desplegable: fila completa debajo del título */
.searchbar { flex: 1 1 100%; }

/* Menú de opciones */
.menu-wrap { position: relative; }
.menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  min-width: 200px;
  padding: var(--space-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-rack);
  background: var(--plate);
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.18);
}
.menu__item {
  display: flex;
  align-items: center;
  min-height: var(--tap);
  padding: 0 var(--space-3);
  border: 0;
  border-radius: var(--radius-control);
  font: inherit;
  font-size: var(--fs-md);
  text-align: left;
  color: var(--text);
  background: transparent;
  cursor: pointer;
}
.menu__item:hover, .menu__item:focus-visible { background: var(--surface); }
#btn-logout { color: var(--danger); }

/* Atajos a columnas */
.colnav {
  display: flex;
  flex-shrink: 0;
  gap: var(--space-2);
  padding-block: var(--space-2) 0;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  overflow-x: auto;
  scrollbar-width: none;
}
.colnav::-webkit-scrollbar { display: none; }

.colnav__chip {
  flex: 0 0 auto;
  height: 36px;
  padding: 0 var(--space-3) 0 var(--space-2);
  border: 1px solid var(--border);
  border-left: 5px solid var(--column-accent);
  border-radius: var(--radius-control);
  font: inherit;
  font-size: var(--fs-sm);
  font-weight: 600;
  font-stretch: var(--wdth-condensed);
  color: var(--text);
  background: var(--plate);
  cursor: pointer;
}

/* Barra de pedidos a Claude: fija abajo; con teclado, sube con él */
.ask {
  position: relative;
  z-index: 25;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding-block: var(--space-2);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--border);
  background: var(--plate);
}
/* Sin teclado, respeta la franja del indicador de inicio */
.ask:not(.has-kb) { padding-bottom: max(var(--space-2), env(safe-area-inset-bottom, 0px)); }

.ask__row { display: flex; gap: var(--space-2); align-items: flex-end; }
.ask textarea.ask__input { resize: none; }
.ask__input {
  flex: 1;
  min-width: 0;
  min-height: var(--tap);
  max-height: 96px;      /* ~4 líneas; después scrollea adentro */
  padding-block: 10px;
  resize: none;
  line-height: 1.35;
}
.ask__reply-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3);
  border-radius: var(--radius-control);
  background: var(--surface);
}
.ask__reply { flex: 1; font-size: var(--fs-sm); line-height: 1.4; color: var(--text); }
.ask__reply.is-error { color: var(--danger); }
.ask__close {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  margin: -6px -4px -6px 0;
  border: 0;
  border-radius: var(--radius-control);
  color: var(--text-muted);
  background: transparent;
  cursor: pointer;
}
.ask.is-busy .ask__send { opacity: 0.6; pointer-events: none; }

/* Micrófono: mientras escucha, se pinta con el color de alta prioridad */
.ask__mic.is-listening {
  border-color: var(--danger);
  color: var(--primary-text);
  background: var(--danger);
  animation: mic-pulse 1.2s ease-in-out infinite;
}
@keyframes mic-pulse {
  50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--danger) 25%, transparent); }
}

/* Login: una T-card grande */
.login {
  min-height: 100%;
  display: grid;
  place-items: start center;
  padding-block: 12vh var(--space-6);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.login__card { width: min(400px, 100%); color: var(--card-ink); filter: drop-shadow(var(--card-shadow)); }
.login__head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-card) var(--radius-card) 0 0;
  background: var(--stock-media);
}
.login__title { font-size: var(--fs-xl); font-weight: 760; font-stretch: var(--wdth-condensed); line-height: 1; }
.login__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin: 0 var(--card-inset);
  padding: var(--space-5) var(--space-4);
  border-radius: 0 0 var(--radius-card) var(--radius-card);
  background: var(--stock-media);
  box-shadow: inset 0 1px 0 var(--card-edge);
}
.login__body .field__label { color: var(--card-ink-muted); }
.login__body .input { background: rgb(255 255 255 / 0.7); border-color: var(--card-edge); color: var(--card-ink); }
.login__msg { font-size: var(--fs-sm); color: var(--card-ink); }
.login__msg:empty { display: none; }
.btn--link { height: auto; padding: 0; align-self: center; color: var(--card-ink); text-decoration: underline; font-weight: 500; }

/* La app ocupa exactamente la pantalla: el tablero scrollea por dentro
   y la página no salta cuando aparece el teclado */
html:has(.app:not([hidden])), html:has(.app:not([hidden])) body { overflow: hidden; overscroll-behavior: none; }
.app {
  position: fixed;
  top: var(--vv-top, 0px);   /* top, no transform: iOS necesita ver el
                                encabezado fijo respecto de la pantalla */
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  height: var(--vvh);
  padding-top: var(--topbar-h, 56px);
  background: var(--bg);
}

/* =========================================================
   5. TABLERO Y COLUMNAS (racks)
   ========================================================= */
.board {
  flex: 1;
  display: flex;
  align-items: flex-start;
  min-height: 0;
  gap: var(--space-3);
  padding-top: var(--space-3);
  padding-bottom: var(--space-3);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scroll-padding: 12px;
}

.column {
  --column-accent: var(--c-slate); /* lo sobrescribe app.js según COLUMNS */
  flex: 0 0 var(--column-width);
  display: flex;
  flex-direction: column;
  max-height: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-rack);
  background: var(--rack);
  scroll-snap-align: start;
  overflow: hidden;
}

/* Placa con el nombre de la columna */
.column__header {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border);
  background: var(--plate);
}

.column__dot {
  align-self: stretch;
  width: 5px;
  margin: calc(var(--space-2) * -1) 0 calc(var(--space-2) * -1) calc(var(--space-3) * -1);
  background: var(--column-accent);
}

.column__title {
  flex: 1;
  margin-left: var(--space-1);
  font-size: var(--fs-lg);
  line-height: 1.1;
  font-weight: 680;
  font-stretch: var(--wdth-condensed);
}

.column__count {
  font-size: var(--fs-sm);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}

.column__add { width: 34px; height: 34px; font-size: var(--fs-lg); }

/* Ranuras del rack: líneas horizontales finas detrás de las tarjetas */
.column__list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 140px;
  padding: var(--space-3);
  overflow-y: auto;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0 23px,
    var(--slot) 23px 24px
  );
  transition: background-color var(--transition);
}

.column__list:empty::after {
  content: "Sin tarjetas. Arrastrá una acá o tocá +";
  padding: var(--space-4) var(--space-2);
  font-size: var(--fs-sm);
  color: var(--text-muted);
  text-align: center;
}

/* Estado: arrastrando sobre la columna */
.column__list.is-over {
  background-color: color-mix(in srgb, var(--column-accent) 14%, transparent);
}

/* =========================================================
   6. TARJETAS EN T
   ========================================================= */
.card {
  --stock: var(--stock-media);
  position: relative;
  display: flex;
  flex-direction: column;
  color: var(--card-ink);
  cursor: grab;
  filter: drop-shadow(var(--card-shadow));
  transition: transform var(--transition);
}

.card[data-priority="baja"]  { --stock: var(--stock-baja); }
.card[data-priority="media"] { --stock: var(--stock-media); }
.card[data-priority="alta"]  { --stock: var(--stock-alta); }

/* Cabeza de la T: ancho completo */
.card__head {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-card) var(--radius-card) 0 0;
  background: var(--stock);
}

.card__title {
  flex: 1;
  font-size: var(--fs-md);
  font-weight: 640;
  font-stretch: var(--wdth-card);
  line-height: 1.25;
}

.card__priority {
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--card-ink-muted);
}

/* Cuerpo de la T: más angosto */
.card__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin: 0 var(--card-inset);
  padding: var(--space-1) var(--space-3) var(--space-3);
  border-radius: 0 0 var(--radius-card) var(--radius-card);
  background: var(--stock);
  /* línea de corte entre cabeza y cuerpo */
  box-shadow: inset 0 1px 0 var(--card-edge);
}

.card__desc {
  font-size: var(--fs-sm);
  line-height: 1.5;
  color: var(--card-ink-muted);
  white-space: pre-line;   /* respeta las viñetas, una por línea */
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1) var(--space-3);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--card-ink-muted);
}
.card__meta:not(:has(:not([hidden]):not(:empty))) { display: none; }
.card__tag::before { content: "#"; }
.card__due:empty { display: none; }

/* Pasar a la siguiente columna (táctil) */
.card__move {
  align-self: flex-start;
  height: 36px;
  padding: 0 var(--space-3);
  border: 1px solid var(--card-edge);
  border-radius: var(--radius-control);
  font: inherit;
  font-size: var(--fs-xs);
  font-weight: 600;

   la base solo deja ver a cada usuario sus propias tareas). */
window.KANBAN_CONFIG = {
  supabaseUrl: "https://thtrdqmdzctmazljbtvn.supabase.co",

<script>
/* =========================================================
   1. CONFIG — columnas y prioridades del tablero.
   Agregá, quitá o renombrá columnas acá; el resto se adapta solo.
   `color` usa los tokens de styles.css.
   ========================================================= */
const COLUMNS = [
  { id: "todo",   title: "Pendiente",   color: "var(--c-slate)" },
  { id: "doing",  title: "En curso",    color: "var(--c-sky)" },
  { id: "review", title: "En revisión", color: "var(--c-amber)" },
  { id: "done",   title: "Hecho",       color: "var(--c-emerald)" },
];

const PRIORITIES = { alta: "Alta", media: "Media", baja: "Baja" };

const FIELDS = ["title", "desc", "requester", "contact", "priority", "column", "tag", "due"];
const THEME_KEY = "kanban.theme";      // preferencia de tema de cada persona

/* =========================================================
   2. ALMACENAMIENTO (Supabase)
   Tabla public.tasks. Cada usuario ve solo sus filas (RLS).
   La página usa nombres cortos; la base usa nombres SQL:
   desc ↔ description · column ↔ status · order ↔ position
   ========================================================= */
const { supabaseUrl, supabaseKey } = window.KANBAN_CONFIG;
const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

let tasks = [];            // [{id, title, ..., order}]
const justAdded = new Set();

function todayISO(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function fromRow(r) {
  return {
    id: r.id,
    title: r.title || "",
    desc: r.description || "",
    requester: r.requester || "",
    contact: r.contact || "",
    priority: PRIORITIES[r.priority] ? r.priority : "media",
    column: COLUMNS.some((c) => c.id === r.status) ? r.status : COLUMNS[0].id,
    tag: r.tag || "",
    due: r.due || "",
    order: Number(r.position) || 0,
  };
}

function toRow(t) {
  const row = {};
  if ("title" in t) row.title = t.title;
  if ("desc" in t) row.description = t.desc;
  if ("requester" in t) row.requester = t.requester;
  if ("contact" in t) row.contact = t.contact;
  if ("priority" in t) row.priority = PRIORITIES[t.priority] ? t.priority : "media";
  if ("column" in t) row.status = COLUMNS.some((c) => c.id === t.column) ? t.column : COLUMNS[0].id;
  if ("tag" in t) row.tag = t.tag;
  if ("due" in t) row.due = t.due || null;
  if ("order" in t) row.position = t.order;
  return row;
}

/* Toma solo los campos conocidos de un objeto (importación) */
function pick(input) {
  const out = {};
  for (const f of FIELDS) if (typeof input[f] === "string") out[f] = input[f].trim();
  return out;
}

function sortTasks() {
  tasks.sort((a, b) => a.order - b.order);
}

async function fetchTasks() {
  const { data, error } = await sb.from("tasks").select("*").order("position");
  if (error) { showError(error); return; }
  tasks = data.map(fromRow);
  sortTasks();
  render();
}

/* Aplica el cambio en pantalla al instante y lo confirma con la base */
const store = {
  async create(data) {
    const col = data.column || COLUMNS[0].id;
    const maxOrder = Math.max(0, ...tasks.filter((t) => t.column === col).map((t) => t.order));
    const row = toRow({ priority: "media", ...data, column: col, order: maxOrder + 1 });
    const { data: saved, error } = await sb.from("tasks").insert(row).select().single();
    if (error) throw error;
    const task = fromRow(saved);
    justAdded.add(task.id);
    if (!tasks.some((t) => t.id === task.id)) tasks.push(task);
    sortTasks();
    render();
    return task;
  },

  async update(id, patch) {
    const current = tasks.find((t) => t.id === id);
    if (!current) throw new Error(`No existe la tarea ${id}`);
    Object.assign(current, patch);
    sortTasks();
    render();
    const { error } = await sb.from("tasks").update(toRow(patch)).eq("id", id);
    if (error) { await fetchTasks(); throw error; }
  },

  async remove(id) {
    tasks = tasks.filter((t) => t.id !== id);
    render();
    const { error } = await sb.from("tasks").delete().eq("id", id);
    if (error) { await fetchTasks(); throw error; }
  },
};

/* Cambios hechos desde otro dispositivo o por Claude: recarga con pausa corta */
let channel = null;
let refetchTimer = null;
function subscribe() {
  channel = sb.channel("tasks-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, () => {
      clearTimeout(refetchTimer);
      refetchTimer = setTimeout(fetchTasks, 300);
    })
    .subscribe();
}

/* =========================================================
   2b. SESIÓN (mail y contraseña)
   ========================================================= */
const loginEl = document.getElementById("login");
const appEl = document.getElementById("app");
const loginForm = document.getElementById("login-form");
const loginMsg = document.getElementById("login-msg");
const loginSubmit = document.getElementById("login-submit");
const loginToggle = document.getElementById("login-toggle");
let signingUp = false;

loginToggle.addEventListener("click", () => {
  signingUp = !signingUp;
  loginSubmit.textContent = signingUp ? "Crear cuenta" : "Entrar";
  loginToggle.textContent = signingUp ? "Ya tengo cuenta" : "Crear cuenta";
  document.getElementById("login-password").autocomplete = signingUp ? "new-password" : "current-password";
  loginMsg.textContent = "";
});

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  loginSubmit.disabled = true;
  loginMsg.textContent = signingUp ? "Creando cuenta…" : "Entrando…";
  const { data, error } = signingUp
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  loginSubmit.disabled = false;
  if (error) {
    loginMsg.textContent = /confirm/i.test(error.message)
      ? "Falta confirmar la cuenta. Abrí el link del mail que te mandó Supabase y volvé a entrar."
      : /invalid/i.test(error.message)
        ? "Mail o contraseña incorrectos."
        : `No se pudo: ${error.message}`;
    return;
  }
  if (signingUp && !data.session) {
    loginMsg.textContent = "Cuenta creada. Confirmala desde el mail que te llegó y después entrá. Si el link abre una página que no carga, igual queda confirmada.";
    loginToggle.click();
  }
});

function showApp(session) {
  const loggedIn = Boolean(session);
  loginEl.hidden = loggedIn;
  appEl.hidden = !loggedIn;
  if (loggedIn && !channel) {
    fetchTasks();
    subscribe();
  }
  if (!loggedIn && channel) {
    sb.removeChannel(channel);
    channel = null;
    tasks = [];
  }
}

sb.auth.onAuthStateChange((_event, session) => showApp(session));

/* =========================================================
   3. HELPERS DOM
   ========================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const fromTemplate = (id) => document.getElementById(id).content.firstElementChild.cloneNode(true);

const board = $("#board");
const modal = $("#modal");
const form = $("#task-form");
const fields = form.elements;

function setStatus(text) {
  $("#status").textContent = text;
}

/* =========================================================
   4. RENDER
   ========================================================= */
function render() {
  const query = $("#search").value.trim().toLowerCase();
  board.replaceChildren();
  renderColnav();

  for (const col of COLUMNS) {
    const colEl = fromTemplate("tpl-column");
    colEl.dataset.column = col.id;
    colEl.style.setProperty("--column-accent", col.color);
    $(".column__title", colEl).textContent = col.title;

    const colTasks = tasks.filter((t) => t.column === col.id);
    $(".column__count", colEl).textContent = colTasks.length;

    const list = $(".column__list", colEl);
    for (const task of colTasks) {
      if (query && !matches(task, query)) continue;
      list.append(renderCard(task));
    }

    $(".column__add", colEl).addEventListener("click", () => openModal(null, col.id));
    bindDropzone(list);
    board.append(colEl);
  }
  justAdded.clear();
}

/* Chips de navegación: en mobile llevan a cada columna */
function renderColnav() {
  const nav = $("#colnav");
  nav.replaceChildren(...COLUMNS.map((col) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "colnav__chip";
    chip.style.setProperty("--column-accent", col.color);
    const count = tasks.filter((t) => t.column === col.id).length;
    chip.textContent = `${col.title} (${count})`;
    chip.addEventListener("click", () => {
      board.querySelector(`[data-column="${col.id}"]`)
        ?.scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
    });
    return chip;
  }));
}

function matches(task, q) {
  return [task.title, task.desc, task.tag, task.requester, task.contact]
    .some((v) => (v || "").toLowerCase().includes(q));
}

function renderCard(task) {
  const card = fromTemplate("tpl-card");
  card.dataset.id = task.id;
  card.dataset.priority = task.priority;
  if (justAdded.has(task.id)) card.classList.add("is-new");

  $(".card__title", card).textContent = task.title;
  $(".card__priority", card).textContent = PRIORITIES[task.priority];

  const desc = $(".card__desc", card);
  desc.textContent = task.desc;
  desc.hidden = !task.desc;

  const req = $(".card__requester", card);
  $("dd", req).textContent = task.requester;
  req.hidden = !task.requester;

  const contact = $(".card__contact", card);
  $("dd", contact).textContent = task.contact;
  contact.hidden = !task.contact;

  const tag = $(".card__tag", card);
  tag.textContent = task.tag;
  tag.hidden = !task.tag;

  const due = $(".card__due", card);
  if (task.due) {
    const date = new Date(task.due + "T00:00");
    const label = date.toLocaleDateString("es-AR", { day: "numeric", month: "short" });
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const overdue = date < today && task.column !== "done";
    if (overdue) card.classList.add("is-overdue");
    due.textContent = `${overdue ? "Venció" : "Vence"} ${label}`;
  }

  const move = $(".card__move", card);
  const next = COLUMNS[COLUMNS.findIndex((c) => c.id === task.column) + 1];
  if (next) {
    move.textContent = next.title;
    move.title = `Pasar a ${next.title}`;
    move.addEventListener("click", (e) => {
      e.stopPropagation();
      store.update(task.id, { column: next.id, order: Date.now() }).catch(showError);
    });
  } else {
    move.hidden = true;
  }

  card.addEventListener("click", () => openModal(task.id));
  card.addEventListener("keydown", (e) => { if (e.key === "Enter") openModal(task.id); });
  card.addEventListener("dragstart", (e) => {
    card.classList.add("is-dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", task.id);
  });
  card.addEventListener("dragend", () => {
    card.classList.remove("is-dragging");
    commitOrderFromDOM();
  });

  return card;
}

/* =========================================================
   5. DRAG & DROP
   ========================================================= */
function bindDropzone(list) {
  list.addEventListener("dragover", (e) => {
    e.preventDefault();
    list.classList.add("is-over");
    const dragging = $(".card.is-dragging");
    if (!dragging) return;
    const after = cardAfterPointer(list, e.clientY);
    after ? list.insertBefore(dragging, after) : list.append(dragging);
  });
  list.addEventListener("dragleave", (e) => {
    if (!list.contains(e.relatedTarget)) list.classList.remove("is-over");
  });
  list.addEventListener("drop", (e) => {
    e.preventDefault();
    list.classList.remove("is-over");
  });
}

function cardAfterPointer(list, y) {
  const cards = [...list.querySelectorAll(".card:not(.is-dragging)")];
  return cards.find((c) => {
    const r = c.getBoundingClientRect();
    return y < r.top + r.height / 2;
  });
}

/* Lee el orden visible y guarda solo las tarjetas que cambiaron */
async function commitOrderFromDOM() {
  const changes = [];
  board.querySelectorAll(".column").forEach((colEl) => {
    colEl.querySelectorAll(".card").forEach((cardEl, i) => {
      const task = tasks.find((t) => t.id === cardEl.dataset.id);
      const column = colEl.dataset.column;
      const order = i + 1;
      if (task && (task.column !== column || task.order !== order)) {
        changes.push([task.id, { column, order }]);
      }
    });
  });
  if (!changes.length) return;
  try {
    for (const [id, patch] of changes) await store.update(id, patch);
  } catch (e) {
    showError(e);
    render();
  }
}

/* =========================================================
   6. MODAL (crear / editar / eliminar)
   ========================================================= */
let editingId = null;

function fillSelects() {
  fields.priority.replaceChildren(...Object.entries(PRIORITIES).map(([v, l]) => new Option(l, v)));
  fields.column.replaceChildren(...COLUMNS.map((c) => new Option(c.title, c.id)));
}

/* La descripción crece hasta mostrar todo el texto */
const descField = document.getElementById("f-desc");
function growDesc() {
  descField.style.height = "auto";
  descField.style.height = descField.scrollHeight + 2 + "px";
}
// iOS a veces mide antes de dibujar el formulario: se vuelve a medir enseguida
function growDescSoon() {
  growDesc();
  requestAnimationFrame(growDesc);
  setTimeout(growDesc, 120);
  setTimeout(growDesc, 350);
}
descField.addEventListener("input", growDesc);

function openModal(id, columnId = COLUMNS[0].id) {
  editingId = id;
  const task = id
    ? tasks.find((t) => t.id === id)
    : { title: "", desc: "", requester: "", contact: "", priority: "media", tag: "", due: "", column: columnId };

  $("#modal-title").textContent = id ? "Editar tarea" : "Nueva tarea";
  for (const f of FIELDS) fields[f].value = task[f];
  resetDelete();
  $("#btn-delete").hidden = !id;

  modal.showModal();
  syncViewport();
  growDescSoon();
  $(".modal__body").scrollTop = 0;
  // Solo abre el teclado al crear; al editar primero se ve la tarjeta
  if (!id) fields.title.focus();
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = {};
  for (const f of FIELDS) data[f] = fields[f].value.trim();
  if (!data.title) return;

  const id = editingId;
  modal.close();
  try {
    if (id) {
      const prev = tasks.find((t) => t.id === id);
      if (prev && prev.column !== data.column) data.order = Date.now();
      await store.update(id, data);
    } else {
      await store.create(data);
    }
  } catch (err) {
    showError(err);
  }
});

/* Eliminar en dos pasos (la página no puede usar confirm()) */
const btnDelete = $("#btn-delete");
let deleteTimer = null;
function resetDelete() {
  clearTimeout(deleteTimer);
  btnDelete.classList.remove("is-confirming");
}
btnDelete.addEventListener("click", async () => {
  if (!btnDelete.classList.contains("is-confirming")) {
    btnDelete.classList.add("is-confirming");
    deleteTimer = setTimeout(resetDelete, 4000);   // si no confirma, vuelve al tacho
    return;
  }
  const id = editingId;
  modal.close();
  try { await store.remove(id); } catch (err) { showError(err); }
});

$("#btn-cancel").addEventListener("click", () => modal.close());
modal.addEventListener("click", (e) => { if (e.target === modal) modal.close(); });

/* =========================================================
   7. PEDIDOS A CLAUDE (lenguaje natural → tarjetas)
   La función "pedido" de Supabase llama a la API de Anthropic
   y escribe en la base con tu sesión. La pantalla se actualiza
   sola por la suscripción en tiempo real.
   ========================================================= */
const ask = $("#ask");
const askInput = $("#ask-input");
const askReply = $("#ask-reply");
const askReplyRow = $("#ask-reply-row");
let replyTimer = null;

/* Mensaje sobre la barra: vacío = oculto; los de éxito se van solos */
function setReply(text, { error = false, sticky = false } = {}) {
  clearTimeout(replyTimer);
  askReply.textContent = text;
  askReply.classList.toggle("is-error", error);
  askReplyRow.hidden = !text;
  if (text && !error && !sticky) replyTimer = setTimeout(() => setReply(""), 8000);
  measureAsk();
}
$("#ask-close").addEventListener("click", () => setReply(""));

ask.addEventListener("submit", async (e) => {
  e.preventDefault();
  const request = askInput.value.trim();
  if (!request || ask.classList.contains("is-busy")) return;

  ask.classList.add("is-busy");
  setReply("Pensando…", { sticky: true });

  const now = new Date();
  // Nunca quedarse colgado: si en 70 s no hay respuesta, se avisa
  const timeout = new Promise((resolve) => setTimeout(() => resolve({
    data: { ok: false, error: "La IA tardó demasiado en responder. Revisá si la tarjeta se creó y, si no, probá de nuevo." },
  }), 70000));
  const slowNote = setTimeout(() => setReply("Sigue pensando… la IA gratis a veces tarda.", { sticky: true }), 12000);
  const { data, error } = await Promise.race([
    sb.functions.invoke("pedido", {
      body: {
        request,
        today: todayISO(),
        todayLong: now.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }),
      },
    }),
    timeout,
  ]);
  clearTimeout(slowNote);
  ask.classList.remove("is-busy");
  if (data?.created?.length) await fetchTasks();

  if (error || !data?.ok) {
    setReply(data?.error || "No se pudo completar el pedido. Probá de nuevo.", { error: true });
    return;
  }
  for (const id of data.created || []) justAdded.add(id);
  setReply(data.reply);
  askInput.value = "";
  autosize();
  askInput.blur();          // baja el teclado para que se vea la tarjeta nueva
  await fetchTasks();
});

/* Dictado por voz (Web Speech API del navegador).
   Tocás el micrófono, hablás (las pausas no cortan) y volvés a tocarlo
   para terminar. El texto queda en el cuadro para revisarlo: se envía
   recién al tocar el botón azul, como en WhatsApp.
   Si el navegador no lo soporta, el botón no aparece y queda el
   dictado del teclado del celular. */
const micBtn = $("#ask-mic");
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;

function setListening(on) {
  micBtn.classList.toggle("is-listening", on);
  micBtn.setAttribute("aria-pressed", String(on));
  micBtn.title = on ? "Dejar de dictar" : "Dictar";
}

if (Recognition) {
  micBtn.hidden = false;
  micBtn.addEventListener("click", () => {
    if (recognizer) { recognizer.stop(); return; }

    recognizer = new Recognition();
    recognizer.lang = "es-AR";
    recognizer.interimResults = true;
    recognizer.continuous = true;

    const before = askInput.value.trim();
    let finalText = "";

    recognizer.onstart = () => {
      setListening(true);
      setReply("Escuchando… tocá el micrófono otra vez para terminar.", { sticky: true });
    };
    recognizer.onresult = (e) => {
      let interim = "";
      finalText = "";
      for (const r of e.results) {
        if (r.isFinal) finalText += r[0].transcript;
        else interim += r[0].transcript;
      }
      askInput.value = [before, finalText || interim].filter(Boolean).join(" ");
      autosize();
    };
    recognizer.onerror = (e) => {
      setReply(e.error === "not-allowed" || e.error === "service-not-allowed"
        ? "El navegador no tiene permiso para usar el micrófono. Habilitalo en los ajustes del sitio."
        : e.error === "no-speech"
          ? "No se escuchó nada. Tocá el micrófono y probá de nuevo."
          : "No se pudo dictar. Probá de nuevo o usá el micrófono del teclado.", { error: true });
    };
    recognizer.onend = () => {
      setListening(false);
      recognizer = null;
      // No se envía solo: queda el texto para revisar y tocar Enviar
      if (!askReply.classList.contains("is-error")) setReply("");
    };

    try { recognizer.start(); } catch { setListening(false); recognizer = null; }
  });
}

/* Enter envía; Shift+Enter hace salto de línea */
askInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask.requestSubmit(); }
});
function autosize() {
  askInput.style.height = "auto";
  askInput.style.height = Math.min(askInput.scrollHeight + 2, 96) + "px";
  measureAsk();
}

/* =========================================================
   7b. TECLADO EN PANTALLA (iOS)
   iOS no achica la página al abrir el teclado: lo tapa. Con la
   Visual Viewport API medimos el espacio visible real y:
   - subimos la barra de pedidos para que quede sobre el teclado
   - ajustamos el alto del formulario de tarea al espacio visible
   ========================================================= */
const root = document.documentElement;
let maxInnerHeight = window.innerHeight;

function measureAsk() {
  root.style.setProperty("--ask-h", ask.offsetHeight + "px");
}

/* La app copia el área visible real: alto y desplazamiento.
   Así el campo enfocado ya queda a la vista y iOS no tiene que
   mover la pantalla; no "peleamos" con su scroll automático. */
let vvFrame = 0;
function syncViewport() {
  cancelAnimationFrame(vvFrame);
  vvFrame = requestAnimationFrame(() => {
    const vv = window.visualViewport;
    if (!vv) return;
    maxInnerHeight = Math.max(maxInnerHeight, window.innerHeight);
    const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    root.style.setProperty("--vvh", Math.round(vv.height) + "px");
    root.style.setProperty("--vv-top", Math.round(vv.offsetTop) + "px");
    ask.classList.toggle("has-kb", kb > 40);
  });
}

if (window.visualViewport) {
  visualViewport.addEventListener("resize", syncViewport);
  visualViewport.addEventListener("scroll", syncViewport);
}
window.addEventListener("resize", () => { syncViewport(); measureAsk(); });
new ResizeObserver(measureAsk).observe(ask);
// El encabezado es fijo: el contenido arranca justo debajo de él
const topbarEl = $(".topbar");
new ResizeObserver(() => root.style.setProperty("--topbar-h", topbarEl.offsetHeight + "px")).observe(topbarEl);

/* Arreglo para el modo app de iPhone: después de cerrar el teclado
   la pantalla puede quedar más chica. Si pasa, forzamos re-medir. */
document.addEventListener("focusout", () => {
  setTimeout(() => {
    syncViewport();
    if (window.innerHeight < maxInnerHeight - 4 && !document.activeElement?.matches("input, textarea, select")) {
      const app = $("#app");
      const y = board.scrollLeft;
      app.style.display = "none";
      void app.offsetHeight;   // fuerza el recálculo
      app.style.display = "";
      board.scrollLeft = y;
      syncViewport();
    }
  }, 150);
});
askInput.addEventListener("input", autosize);

/* =========================================================
   8. ACCIONES DEL HEADER (tema, búsqueda, exportar, importar)
   ========================================================= */
function showError(err) {
  console.error(err);
  setStatus("No se pudo guardar el cambio");
  setTimeout(() => setStatus(""), 5000);
}

function applyTheme(theme) {
  if (theme) document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
}

function storedTheme() {
  try { return localStorage.getItem(THEME_KEY); } catch { return null; }
}

$("#btn-theme").addEventListener("click", () => {
  const current = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch { /* ignorar */ }
});

$("#btn-new").addEventListener("click", () => openModal(null));
$("#search").addEventListener("input", render);

/* Búsqueda desplegable */
const btnSearch = $("#btn-search");
const searchbar = $("#searchbar");
btnSearch.addEventListener("click", () => {
  const open = searchbar.hidden;
  searchbar.hidden = !open;
  btnSearch.setAttribute("aria-expanded", String(open));
  if (open) $("#search").focus();
  else { $("#search").value = ""; render(); }
});

/* Menú de opciones */
const btnMenu = $("#btn-menu");
const menu = $("#menu");
function toggleMenu(open = menu.hidden) {
  menu.hidden = !open;
  btnMenu.setAttribute("aria-expanded", String(open));
}
btnMenu.addEventListener("click", (e) => { e.stopPropagation(); toggleMenu(); });
menu.addEventListener("click", () => toggleMenu(false));
document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) toggleMenu(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menu.hidden) toggleMenu(false); });

$("#btn-export").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" }));
  a.download = `tareas-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});

$("#btn-logout").addEventListener("click", () => sb.auth.signOut());

$("#input-import").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const list = JSON.parse(await file.text());
    const items = Array.isArray(list) ? list : list?.tasks;
    if (!Array.isArray(items)) throw new Error("formato");
    for (const raw of items) await store.create(pick({ ...raw }));
    setStatus(`Se importaron ${items.length} tareas`);
  } catch {
    setStatus("Ese archivo no es un respaldo del tablero");
  }
  setTimeout(() => setStatus(""), 5000);
});

/* Atajo: tecla "n" = nueva tarea (si no estás escribiendo) */
document.addEventListener("keydown", (e) => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (e.key === "n" && !typing && !modal.open) { e.preventDefault(); openModal(null); }
});

/* =========================================================
   9. INICIO
   ========================================================= */
applyTheme(storedTheme());
fillSelects();
sb.auth.getSession().then(({ data }) => showApp(data.session));
syncViewport();

</script>
